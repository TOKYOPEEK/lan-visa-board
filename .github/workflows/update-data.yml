# Раз в 8 часов забирает свежий список турниров с cslans.com и коммитит
# data/tournaments.json. Пуш в main триггерит редеплой (Cloudflare Pages /
# Vercel подхватывают его сами). При недоступности источника скрипт выходит
# с кодом 0 и старый снапшот остаётся — сайт продолжает жить на нём.
name: update-tournaments

on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch tournaments from cslans.com
        run: node scripts/fetch-tournaments.mjs

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- data/tournaments.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name "lan-visa-board-bot"
          git config user.email "misirrro@gmail.com"
          git add data/tournaments.json
          git commit -m "data: обновление снапшота cslans $(date -u +%Y-%m-%dT%H:%M)"
          git push

      # Деплой на Cloudflare Pages. Работает, когда в секретах репозитория
      # задан CLOUDFLARE_API_TOKEN (Dashboard -> My Profile -> API Tokens ->
      # Create Token -> шаблон "Edit Cloudflare Workers" или кастомный с
      # правом Cloudflare Pages:Edit). Без токена шаг тихо пропускается —
      # сайт просто живёт на последнем ручном деплое (npm run deploy).
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 066f2d2a7112711a68ccf480afabb01e
          SITE_URL: https://lan-tablo.pages.dev
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN не задан — пропускаю деплой"
            exit 0
          fi
          npm run build
          npx wrangler pages deploy dist --project-name lan-tablo --branch main --commit-dirty=true
